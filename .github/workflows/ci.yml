name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bunx @biomejs/biome check .

      - name: Typecheck
        run: bun run check-types

      - name: Build
        run: bun run build

      - name: CLI smoke test
        run: node dist/index.js --help
